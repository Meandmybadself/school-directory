name = "school-directory-redirect"
main = "src/index.ts"
compatibility_date = "2025-01-01"
account_id = "c3b373ae8a90a6494e520f962bdf462b"

# Only deployed to production — there is nothing to run locally. Owns every
# hostname that exists only to 301 somewhere else; the host → target map is in
# src/index.ts, and every hostname there needs a custom_domain route here.
#
# Custom domains — wrangler provisions the DNS record + cert on deploy. Both
# zones are on this account.

# Retired directory host. The CNAME that previously pointed it at the Pages
# project was removed when the domain was detached from it, so wrangler owns
# the record now.
[[env.production.routes]]
pattern = "directory.meandmybadself.com"
custom_domain = true

# Vanity host for the PTO's standing Google Meet room.
[[env.production.routes]]
pattern = "ptomeet.eisenhower.school"
custom_domain = true
