<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Public, but deliberately NOT indexed (invariant 33): a found jacket is
         nobody's business but its owner's, and a search engine is the wrong
         way for a stranger to learn what turned up at a school. The bundle is
         the whole site, so this one tag covers every page. -->
    <meta name="robots" content="noindex,nofollow" />
    <meta name="theme-color" content="#f7f7f5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#16181c" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="Lost &amp; Found" />
    <title>Eisenhower Lost &amp; Found</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
