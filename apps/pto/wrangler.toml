# Cloudflare Pages project for the PTO site.
#
# apps/web and apps/calendar are pure static Pages deploys and have no
# wrangler.toml at all. This one does, for the reason apps/newsletter's and
# apps/store's do: it ships Pages Functions — the indexed public page at /,
# robots.txt and sitemap.xml — and those need to know where the API is at
# REQUEST time, which a Vite build-time variable can't reach.
#
# Pages has exactly two environments: production (the main branch) and preview
# (every other branch). There is only one API, so both point at it.

name = "school-pto"
compatibility_date = "2025-01-01"
pages_build_output_dir = "dist"

[vars]
API_BASE = "https://api-directory.eisenhower.school"

[env.preview.vars]
API_BASE = "https://api-directory.eisenhower.school"
