# Cloudflare Pages project for the PTO site.
#
# apps/web and apps/calendar are pure static Pages deploys and have no
# wrangler.toml at all. This one does because it ships Pages Functions — the
# indexed public page at /, robots.txt and sitemap.xml — and `wrangler pages
# deploy` needs to be told the output directory for a project that has them.
#
# Like apps/newsletter's and apps/store's, it declares API_BASE, needed at
# REQUEST time (a Vite build-time variable can't reach a Function): the landing
# page reads the anonymous calendar projections for its live volunteer list —
# the one read on this origin, taken on deliberately (see
# functions/_lib/volunteers.ts). /resource-center reads nothing. SCHOOL_TIMEZONE
# is here for the same reason apps/home carries it: the event links the landing
# page mints must name the same day the calendar files the event under
# (CLAUDE.md, "Conventions").
#
# Pages has exactly two environments: production (the main branch) and preview
# (every other branch). There is only one API, so both point at it.

name = "school-pto"
compatibility_date = "2025-01-01"
pages_build_output_dir = "dist"

[vars]
API_BASE = "https://api-directory.eisenhower.school"
SCHOOL_TIMEZONE = "America/Chicago"

[env.preview.vars]
API_BASE = "https://api-directory.eisenhower.school"
SCHOOL_TIMEZONE = "America/Chicago"
