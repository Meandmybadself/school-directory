name = "school-directory-api"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]
account_id = "c3b373ae8a90a6494e520f962bdf462b"

# Single-tenant config. SCHOOL_NAME is surfaced in UI copy via /me + i18n.
[vars]
SCHOOL_NAME = "Eisenhower"
# Default SPA origin: where a magic link lands when the sign-in didn't name an
# app (see routes/auth.ts's returnTo).
APP_URL = "http://localhost:5173"
# Comma-separated origins allowed to call the API with credentials. Doubles as
# the allowlist of valid magic-link return targets — same trust boundary.
# 5173 = directory (apps/web), 5174 = calendar (apps/calendar),
# 5175 = newsletter (apps/newsletter).
ALLOWED_ORIGINS = "http://localhost:5173,http://localhost:5174,http://localhost:5175"
# Public origin of the newsletter app. Sent emails link here for "view in
# browser" and unsubscribe, so it must be the reader-facing host, not the API.
NEWSLETTER_URL = "http://localhost:5175"
# Zone for naming event days/times in server-rendered output (newsletter email
# and public archive), which has no viewer whose zone could be used instead.
SCHOOL_TIMEZONE = "America/Chicago"
# Geocoding endpoint (OpenStreetMap Nominatim). Override to a self-hosted/paid
# instance if address volume ever outgrows the public endpoint's 1 rps policy.
NOMINATIM_URL = "https://nominatim.openstreetmap.org/search"
# Comma-separated emails granted system_admin on sign-in. Set this BEFORE the
# first deploy — these accounts can sign in even when registration is closed, so
# they bootstrap a bare instance (then open registration / bulk-import / invite).
# e.g. "office@school.edu,principal@school.edu"
BOOTSTRAP_ADMIN_EMAILS = ""
# Optional static-map provider template ({lat}{lon}{w}{h}{zoom}) for the address
# map thumbnail. Unset → a single OSM tile (no key). Set a keyed provider (e.g.
# Geoapify/Stadia/Mapbox) for centered/marker maps. Rendered server-side; coords
# never reach the client.
# STATIC_MAP_URL = ""

# D1 (SQLite). For LOCAL dev `wrangler dev` uses a local sqlite file under .wrangler/
# and applies migrations from migrations_dir. Replace database_id after running
# `wrangler d1 create school-directory` to go remote (see README).
[[d1_databases]]
binding = "DB"
database_name = "school-directory"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

# R2 for profile photos (served via signed Worker route).
[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "school-directory-photos"

# R2 for newsletter images/logos. Deliberately separate from PHOTOS: everything
# in here is served by a public, unauthenticated route so it can render in an
# inbox, and keeping private member photos out of the same bucket means there is
# no key-prefix guard that could ever be forgotten.
[[r2_buckets]]
binding = "NEWSLETTER_MEDIA"
bucket_name = "school-directory-newsletter-media"

# Cron schedules, dispatched by the `scheduled` handler in src/index.ts:
#   0 */3 * * *  shared-calendar refresh — re-fetch all ICS feeds every 3 hours
#   0 13 * * *   new-member digest (~8am Central); no-op unless notifications
#                are set to "daily" in Admin → Notifications
# Mirrored under env.production below.
[triggers]
crons = ["0 */3 * * *", "0 13 * * *"]

# Secrets (set via `wrangler secret put --env production`, or .dev.vars locally):
#   RESEND_API_KEY   — Resend email API key (magic links / invites)
#   EMAIL_FROM       — verified Resend sender, e.g. "Eisenhower Directory <directory@…>"
#   SESSION_SECRET   — random string reserved for HMAC needs

# ── Production environment (deploy with `wrangler deploy --env production`) ──────
# SPA:        https://directory.eisenhower.school  (Pages)
# Calendar:   https://calendar.eisenhower.school   (Pages, apps/calendar)
# Newsletter: https://newsletter.eisenhower.school (Pages, apps/newsletter)
# API:        https://api-directory.eisenhower.school (this Worker, custom domain below)
# All three SPAs share this API, its D1, and its session cookie — the cookie is
# host-only to this Worker and same-site across eisenhower.school subdomains.
# The former host (directory.meandmybadself.com) 301s here via apps/redirect.
[env.production.vars]
SCHOOL_NAME = "Eisenhower"
APP_URL = "https://directory.eisenhower.school"
ALLOWED_ORIGINS = "https://directory.eisenhower.school,https://calendar.eisenhower.school,https://newsletter.eisenhower.school"
NEWSLETTER_URL = "https://newsletter.eisenhower.school"
SCHOOL_TIMEZONE = "America/Chicago"
NOMINATIM_URL = "https://nominatim.openstreetmap.org/search"
BOOTSTRAP_ADMIN_EMAILS = "meandmybadself@gmail.com"

[[env.production.d1_databases]]
binding = "DB"
database_name = "school-directory"
database_id = "ccd3f017-fce7-4ca4-a91d-7a903d2d82a6"
migrations_dir = "migrations"

[[env.production.r2_buckets]]
binding = "PHOTOS"
bucket_name = "school-directory-photos"

[[env.production.r2_buckets]]
binding = "NEWSLETTER_MEDIA"
bucket_name = "school-directory-newsletter-media"

[env.production.triggers]
crons = ["0 */3 * * *", "0 13 * * *"]

# Custom domain — wrangler provisions the DNS record + cert on deploy (zone is
# on this account).
[[env.production.routes]]
pattern = "api-directory.eisenhower.school"
custom_domain = true
