name = "school-directory-api"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]
account_id = "c3b373ae8a90a6494e520f962bdf462b"

# Single-tenant config. SCHOOL_NAME is surfaced in UI copy via /me + i18n.
[vars]
SCHOOL_NAME = "Eisenhower PTO"
# Default SPA origin: where a magic link lands when the sign-in didn't name an
# app (see routes/auth.ts's returnTo).
APP_URL = "http://localhost:5173"
# Comma-separated origins allowed to call the API with credentials. Doubles as
# the allowlist of valid magic-link return targets — same trust boundary.
# 5173 = directory (apps/web), 5174 = calendar (apps/calendar),
# 5175 = newsletter (apps/newsletter), 5177 = store (apps/store),
# 5178 = pto (apps/pto).
ALLOWED_ORIGINS = "http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:5177,http://localhost:5178"
# Public origin of the newsletter app. Sent emails link here for "view in
# browser" and unsubscribe, so it must be the reader-facing host, not the API.
# Public calendar site. Newsletter events blocks link out to it ("See all
# events"), in the email and on the public archive alike.
CALENDAR_URL = "http://localhost:5174"
NEWSLETTER_URL = "http://localhost:5175"
# Public origin of the store. Stripe's success/cancel URLs and the order-status
# links in confirmation email point here, so it must be the reader-facing host.
STORE_URL = "http://localhost:5177"
# Public origin of the PTO site. The front door links here; nothing the API
# sends by email points at it yet.
PTO_URL = "http://localhost:5178"
# Which Printful store the API key acts on (X-PF-Store-Id). Not a secret, but
# expected to CHANGE ONCE, when this moves from a personal Printful store to the
# PTO's — see migration 0022 on why that day is a re-point, not a migration.
# PRINTFUL_STORE_ID = ""
# The school's timezone (IANA). Every timed event is read in it: unzoned feed
# times, the newsletter email and archive, Slack, PTO board dates. Keep it in
# step with apps/home's SCHOOL_TIMEZONE and the calendar build's
# VITE_SCHOOL_TIMEZONE (deploy.yml). Unset or invalid → America/Chicago.
SCHOOL_TIMEZONE = "America/Chicago"
# Geocoding endpoint (OpenStreetMap Nominatim). Override to a self-hosted/paid
# instance if address volume ever outgrows the public endpoint's 1 rps policy.
NOMINATIM_URL = "https://nominatim.openstreetmap.org/search"
# Comma-separated emails granted system_admin on sign-in. Set this BEFORE the
# first deploy — these accounts can sign in even when registration is closed, so
# they bootstrap a bare instance (then open registration / bulk-import / invite).
# e.g. "office@school.edu,principal@school.edu"
BOOTSTRAP_ADMIN_EMAILS = ""
# Optional static-map provider template ({lat}{lon}{w}{h}{zoom}) for the address
# map thumbnail. Unset → a single OSM tile (no key). Set a keyed provider (e.g.
# Geoapify/Stadia/Mapbox) for centered/marker maps. Rendered server-side; coords
# never reach the client.
# STATIC_MAP_URL = ""

# D1 (SQLite). For LOCAL dev `wrangler dev` uses a local sqlite file under .wrangler/
# and applies migrations from migrations_dir. Replace database_id after running
# `wrangler d1 create school-directory` to go remote (see README).
[[d1_databases]]
binding = "DB"
database_name = "school-directory"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

# R2 for profile photos (served via signed Worker route).
[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "school-directory-photos"

# R2 for newsletter images/logos. Deliberately separate from PHOTOS: everything
# in here is served by a public, unauthenticated route so it can render in an
# inbox, and keeping private member photos out of the same bucket means there is
# no key-prefix guard that could ever be forgotten.
[[r2_buckets]]
binding = "NEWSLETTER_MEDIA"
bucket_name = "school-directory-newsletter-media"

# Cron schedules, dispatched by the `scheduled` handler in src/index.ts:
#   0 */3 * * *  shared-calendar refresh — re-fetch all ICS feeds every 3 hours
#   0 13 * * *   new-member digest (~8am Central); no-op unless notifications
#                are set to "daily" in Admin → Notifications
#   */15 * * * * store: re-drive paid orders that never reached Printful. Short,
#                because what it recovers is a CHARGED order that hasn't been
#                printed. Overlaps with the other two are harmless — the handler
#                dispatches on event.cron, and the submission claim is a guarded
#                UPDATE only one caller can win.
#
# THREE IS THE ACCOUNT'S CEILING. The Workers FREE plan caps an ACCOUNT — not a
# Worker — at five cron triggers, and these three plus bus-notify's two are
# exactly five. A fourth here fails the deploy at the trigger step, AFTER the
# code has uploaded, which looks like a broken deploy of working code. Adding one
# means freeing a slot or moving to Workers Paid.
# Mirrored under env.production below.
[triggers]
crons = ["0 */3 * * *", "0 13 * * *", "*/15 * * * *"]

# Rate limiting for the reads that serve ONE family's data to another
# (invariant 32's routes). The threat this answers is the one the parent who
# prompted the access gate actually named: not a stranger, but an APPROVED
# member paging the roster with a script. Approval removes the anonymous
# population; this bounds what an account can do once it is in, and the two are
# complements rather than alternatives.
#
# 60 a minute, per USER rather than per IP — the thing being limited is an
# authenticated member enumerating people, and a household behind one NAT
# address must not throttle itself. A parent opening profiles rarely passes 20
# a minute, so this is ~3x headroom; a crawler wanting all 168 profiles trips
# it inside the first two pages.
#
# `period` accepts only 10 or 60 (wrangler's own schema), and the binding is
# NOT inherited by named environments — hence the copy under env.production.
# `namespace_id` is an arbitrary account-unique integer-as-string, not a
# resource to create: nothing has to exist before this deploys.
#
# Photos are deliberately NOT limited: one directory page fires up to 50
# `<img src="/photos/:key">` at once, so a shared budget would break ordinary
# browsing on the first screen. A photo key is only learnable from a listing
# this DOES limit, and a ULID is not guessable, so bounding the listing bounds
# the photos.
[[ratelimits]]
name = "READ_LIMIT"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

# Secrets (set via `wrangler secret put --env production`, or .dev.vars locally):
#   RESEND_API_KEY    — Resend email API key (magic links / invites)
#   EMAIL_FROM        — verified Resend sender, e.g. "Eisenhower Directory <directory@…>"
#   SLACK_WEBHOOK_URL — Slack Incoming Webhook for system-event notifications
#                       (optional; the feature is off entirely when unset, and
#                       logs to the console instead — see CLAUDE.md invariant 22)
#   PRINTFUL_API_KEY  — Printful v1 API key (store catalog + order submission)
#   STRIPE_SECRET_KEY — Stripe secret key (Checkout Session creation)
#   STRIPE_WEBHOOK_SECRET   — signing secret for the endpoint configured at
#                             https://api-directory.eisenhower.school/store-webhooks/stripe
#   PRINTFUL_WEBHOOK_SECRET — shared secret echoed in ?s= on Printful's webhook
#   STORE_SECRET      — keys the store's own HMACs (signed shipping quotes and
#                       derived order-status tokens). UNLIKE the others this one
#                       does NOT degrade gracefully: a guessable quote key is a
#                       guessable price, so it is MANDATORY wherever
#                       STRIPE_SECRET_KEY is set. Rotating it invalidates every
#                       order-status link already emailed.

# ── Production environment (deploy with `wrangler deploy --env production`) ──────
# SPA:        https://directory.eisenhower.school  (Pages)
# Calendar:   https://calendar.eisenhower.school   (Pages, apps/calendar)
# Newsletter: https://newsletter.eisenhower.school (Pages, apps/newsletter)
# Store:      https://store.eisenhower.school      (Pages, apps/store)
# PTO:        https://pto.eisenhower.school        (Pages, apps/pto)
# API:        https://api-directory.eisenhower.school (this Worker, custom domain below)
# All five SPAs share this API, its D1, and its session cookie — the cookie is
# host-only to this Worker and same-site across eisenhower.school subdomains.
# The former host (directory.meandmybadself.com) 301s here via apps/redirect.
[env.production.vars]
SCHOOL_NAME = "Eisenhower PTO"
APP_URL = "https://directory.eisenhower.school"
ALLOWED_ORIGINS = "https://directory.eisenhower.school,https://calendar.eisenhower.school,https://newsletter.eisenhower.school,https://store.eisenhower.school,https://pto.eisenhower.school"
CALENDAR_URL = "https://calendar.eisenhower.school"
NEWSLETTER_URL = "https://newsletter.eisenhower.school"
STORE_URL = "https://store.eisenhower.school"
PTO_URL = "https://pto.eisenhower.school"
SCHOOL_TIMEZONE = "America/Chicago"
NOMINATIM_URL = "https://nominatim.openstreetmap.org/search"
BOOTSTRAP_ADMIN_EMAILS = "meandmybadself@gmail.com"

[[env.production.d1_databases]]
binding = "DB"
database_name = "school-directory"
database_id = "ccd3f017-fce7-4ca4-a91d-7a903d2d82a6"
migrations_dir = "migrations"

[[env.production.r2_buckets]]
binding = "PHOTOS"
bucket_name = "school-directory-photos"

[[env.production.r2_buckets]]
binding = "NEWSLETTER_MEDIA"
bucket_name = "school-directory-newsletter-media"

[env.production.triggers]
crons = ["0 */3 * * *", "0 13 * * *", "*/15 * * * *"]

# Not inherited from the top level — see the note there.
[[env.production.ratelimits]]
name = "READ_LIMIT"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

# Custom domain — wrangler provisions the DNS record + cert on deploy (zone is
# on this account).
[[env.production.routes]]
pattern = "api-directory.eisenhower.school"
custom_domain = true
