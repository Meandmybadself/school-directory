<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- The authoring app is members-only; the public archive pages are served
         by Pages Functions and set their own, indexable meta. -->
    <meta name="robots" content="noindex,nofollow" />
    <title>Eisenhower PTO Newsletter</title>

    <!-- Add to Home Screen (iOS) + installable PWA. This shell serves the
         members-only authoring app (/app, /admin, …); the public archive at /
         and /n/:slug is server-rendered by Pages Functions and sets its own. -->
    <meta name="theme-color" content="#ffffff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Newsletter" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
