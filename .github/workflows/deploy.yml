name: Deploy

# Deploy on merge to main, or manually via the Actions tab / `gh workflow run`.
# No-ops cleanly until the Cloudflare secrets are set:
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Gate. `deploy` needs this, so a typecheck/test/build failure stops the ship
  # instead of racing it. Before this existed, ci.yml ran on push to main in
  # PARALLEL with the deploy — which meant a direct push to main could migrate
  # the production database and publish both apps while its tests were still
  # running, or after they had already failed.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5

      - name: Skip if Cloudflare secrets are absent
        id: guard
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Cloudflare secrets not configured — skipping deploy."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v6
        if: steps.guard.outputs.enabled == 'true'
      - uses: actions/setup-node@v5
        if: steps.guard.outputs.enabled == 'true'
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.guard.outputs.enabled == 'true'

      - name: Apply D1 migrations
        if: steps.guard.outputs.enabled == 'true'
        working-directory: apps/api
        run: pnpm exec wrangler d1 migrations apply school-directory --remote --env production

      - name: Deploy API (Worker)
        if: steps.guard.outputs.enabled == 'true'
        working-directory: apps/api
        run: pnpm exec wrangler deploy --env production

      - name: Deploy legacy-host redirect (Worker)
        if: steps.guard.outputs.enabled == 'true'
        working-directory: apps/redirect
        run: pnpm exec wrangler deploy --env production

      # The apex, eisenhower.school. Server-rendered landing page, no build
      # step — see apps/home/wrangler.toml. It also owns www, which it 301s.
      - name: Deploy home (Worker)
        if: steps.guard.outputs.enabled == 'true'
        working-directory: apps/home
        run: pnpm exec wrangler deploy --env production

      - name: Build & deploy web (Pages)
        if: steps.guard.outputs.enabled == 'true'
        working-directory: apps/web
        env:
          VITE_API_URL: https://api-directory.eisenhower.school
          VITE_CALENDAR_URL: https://calendar.eisenhower.school
          VITE_NEWSLETTER_URL: https://newsletter.eisenhower.school
        run: |
          pnpm build
          pnpm exec wrangler pages deploy dist --project-name school-directory --branch main

      - name: Build & deploy calendar (Pages)
        if: steps.guard.outputs.enabled == 'true'
        working-directory: apps/calendar
        env:
          VITE_API_URL: https://api-directory.eisenhower.school
          VITE_DIRECTORY_URL: https://directory.eisenhower.school
          VITE_NEWSLETTER_URL: https://newsletter.eisenhower.school
        run: |
          pnpm build
          pnpm exec wrangler pages deploy dist --project-name school-calendar --branch main

      # Unlike the other two Pages projects this one ships Pages Functions (the
      # public archive at / and /n/:slug), so it deploys from its own
      # wrangler.toml — which is where the Functions get API_BASE — rather than
      # naming the output directory and project on the command line.
      - name: Build & deploy newsletter (Pages)
        if: steps.guard.outputs.enabled == 'true'
        working-directory: apps/newsletter
        env:
          VITE_API_URL: https://api-directory.eisenhower.school
          VITE_DIRECTORY_URL: https://directory.eisenhower.school
          VITE_CALENDAR_URL: https://calendar.eisenhower.school
        run: |
          pnpm build
          pnpm exec wrangler pages deploy --branch main
